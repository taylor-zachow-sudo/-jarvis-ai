<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS AI</title>

<style>
body{
margin:0;
background:#050b14;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:#00d9ff;
overflow:hidden;
}

.circle{
width:220px;
height:220px;
border-radius:50%;
border:4px solid #00d9ff;
box-shadow:0 0 40px #00d9ff;
animation:pulse 2s infinite;
display:flex;
justify-content:center;
align-items:center;
font-size:30px;
font-weight:bold;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.08);}
100%{transform:scale(1);}
}

#status{
position:absolute;
bottom:80px;
font-size:22px;
}

button{
position:absolute;
bottom:20px;
padding:15px 35px;
font-size:20px;
background:#00d9ff;
border:none;
border-radius:40px;
cursor:pointer;
}

button:hover{
background:white;
}
</style>

</head>

<body>

<div class="circle">
JARVIS
</div>

<div id="status">
SYSTEM ONLINE
</div>
<div id="chat"></div>

<div class="input-area">
    <input id="userInput" type="text" placeholder="Nachricht an JARVIS...">
    <button id="sendButton" type="button">➤</button>

<button onclick="speak('Hallo. Ich bin JARVIS.')">
🔊 Stimme testen
</button>
    
</div>
<button onclick="startJarvis()">
    🎤 Aktivieren
</button>

<button onclick="startVoiceMode()">
🎙️ Sprachmodus
</button>

<button onclick="stopVoiceMode()">
⏹️ Sprachmodus beenden
</button>
    
<script src="memory.js"></script>
<script src="weather.js"></script>
<script src="chat.js"></script>
<script src="script.js"></script>

<script>
document.getElementById("sendButton").addEventListener("click", function() {
    sendText();
});

document.getElementById("userInput").addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        sendText();
    }
});
</script>

</body>
</html>
