<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>JARVIS AI</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #050b14;
    font-family: Arial, sans-serif;
    color: #00d9ff;
    height: 100vh;
    overflow: hidden;

    display: flex;
    flex-direction: column;
    align-items: center;
}


/* ==========================================
   JARVIS KREIS
========================================== */

.circle {

    width: 200px;
    height: 200px;

    border-radius: 50%;

    border: 4px solid #00d9ff;

    box-shadow:
        0 0 20px #00d9ff,
        0 0 50px #00d9ff;

    animation: pulse 2s infinite;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 30px;
    font-weight: bold;

    margin-top: 30px;
}


@keyframes pulse {

    0% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.07);
    }

    100% {
        transform: scale(1);
    }
}


/* ==========================================
   STATUS
========================================== */

#status {

    margin-top: 15px;

    font-size: 18px;

    text-align: center;
}


/* ==========================================
   CHAT
========================================== */

#chat {

    width: 90%;
    max-width: 600px;

    height: 45vh;

    overflow-y: auto;

    margin-top: 15px;

    padding: 10px;

    border: 1px solid #00d9ff;

    border-radius: 15px;

    background: #06121f;
}


.message {

    padding: 10px;

    margin: 7px 0;

    border-radius: 10px;

    word-wrap: break-word;
}


.user-message {

    background: #10283a;

    color: white;

    text-align: right;
}


.jarvis-message {

    background: #071a25;

    text-align: left;
}


/* ==========================================
   EINGABE
========================================== */

.input-area {

    position: fixed;

    bottom: 80px;

    left: 50%;

    transform: translateX(-50%);

    width: 90%;

    max-width: 600px;

    display: flex;

    gap: 8px;
}


#userInput {

    flex: 1;

    padding: 14px;

    border-radius: 25px;

    background: #08121e;

}

    border: none;

    background: #00d9ff;

    cursor: pointer;
}


#sendButton:active {
    transform: scale(0.9);
}


/* ==========================================
   BUTTONS
========================================== */

.control-buttons {

    position: fixed;

    bottom: 15px;

    display: flex;

    gap: 10px;
}


.control-button {

}

</style>

</head>


<body>


<!-- ==========================================
     JARVIS
========================================== -->

<div class="circle">
    JARVIS
</div>


<div id="status">
    SYSTEM ONLINE
</div>


<!-- ==========================================
     CHAT
========================================== -->

<div id="chat"></div>


<!-- ==========================================
     EINGABE
========================================== -->

<div class="input-area">

    <input
        id="userInput"
        type="text"
        placeholder="Nachricht an JARVIS..."
        autocomplete="off"
    >

    <button
        id="sendButton"
        type="button"
    >
        ➤
    </button>

</div>


<!-- ==========================================
     STEUERUNG
========================================== -->

<div class="control-buttons">

    <button
        id="voiceButton"
        class="control-button"
        type="button"
    >
        🔊 Stimme testen
    </button>

    <button
        id="micButton"
        class="control-button"
        type="button"
    >
        🎤 Aktivieren
    </button>

</div>


<!-- ==========================================
     JARVIS DATEIEN
========================================== -->

<script src="memory.js?v=20"></script>

<script src="weather.js?v=20"></script>

<script src="reminders.js?v=20"></script>

<script src="script.js?v=20"></script>

<script src="chat.js?v=20"></script>


<script>

/* ==========================================
   JARVIS START
========================================== */

console.log("JARVIS wird gestartet...");


/* ==========================================
   NACHRICHT ANZEIGEN
========================================== */

function addMessage(text, type) {

    const chat =
        document.getElementById("chat");

    if (!chat) {
        return;
    }

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    message.textContent =
        text;

    chat.appendChild(message);

    chat.scrollTop =
        chat.scrollHeight;
}


/* ==========================================
   APP ÖFFNEN
========================================== */

function openApp(app) {

    let url = "";


    if (app === "youtube") {

        url = "https://youtube.com";

    }


    else if (app === "whatsapp") {

        url = "whatsapp://";

    }


    else if (app === "spotify") {

        url = "spotify://";

    }


    else if (app === "instagram") {

        url = "instagram://";

    }


    else if (app === "tiktok") {

        url = "tiktok://";

    }


    else if (app === "google") {

        url = "https://google.com";

    }


    if (url) {

        console.log(
            "JARVIS öffnet:",
            app
        );

        window.location.href = url;

    }

}


/* ==========================================
   APP-BEFEHL ERKENNEN
========================================== */

function checkAppCommand(text) {

    const lower =
        text.toLowerCase();


    if (
        lower.includes("öffne youtube") ||
        lower.includes("starte youtube")
    ) {

        return "youtube";

    }


    if (
        lower.includes("öffne whatsapp") ||
        lower.includes("starte whatsapp")
    ) {

        return "whatsapp";

    }


    if (
        lower.includes("öffne spotify") ||
        lower.includes("starte spotify")
    ) {

        return "spotify";

    }


    if (
        lower.includes("öffne instagram") ||
        lower.includes("starte instagram")
    ) {

        return "instagram";

    }


    if (
        lower.includes("öffne tiktok") ||
        lower.includes("starte tiktok")
    ) {

        return "tiktok";

    }


    if (
        lower.includes("öffne google") ||
        lower.includes("starte google")
    ) {

        return "google";

    }


    return null;
}


/* ==========================================
   NACHRICHT SENDEN
========================================== */

function sendText() {

    console.log(
        "JARVIS sendText gestartet."
    );


    const input =
        document.getElementById("userInput");


    if (!input) {

        alert(
            "JARVIS: Eingabefeld nicht gefunden."
        );

        return;
    }


    const text =
        input.value.trim();


    if (!text) {

        return;
    }


    /* ======================================
       BENUTZER-NACHRICHT
    ====================================== */

    addMessage(
        "Du: " + text,
        "user-message"
    );


    input.value = "";


    const lower =
        text.toLowerCase();


    /* ======================================
       APPS
    ====================================== */

    const app =
        checkAppCommand(text);


    if (app) {

        let appName =
            app.charAt(0).toUpperCase() +
            app.slice(1);


        const answer =
            "Ich öffne " +
            appName +
            ".";


        addMessage(
            "JARVIS: " + answer,
            "jarvis-message"
        );


        if (
            typeof speak ===
            "function"
        ) {

            speak(answer);

        }


        /*
         * Kleine Verzögerung,
         * damit JARVIS die Antwort
         * noch anzeigen kann.
         */

        setTimeout(
            function() {

                openApp(app);

            },
            500
        );


        return;
    }


    /* ======================================
       NAME SPEICHERN
    ====================================== */

    if (
        lower.includes("mein name ist ")
    ) {

        const position =
            lower.indexOf("mein name ist ");


        const name =
            text.substring(
                position + 14
            ).trim();


        if (name) {

            if (
                typeof saveMemory ===
                "function"
            ) {

                saveMemory(
                    "name",
                    name
                );

            }


            const answer =
                "Verstanden. Ich werde mir deinen Namen merken.";


            addMessage(
                "JARVIS: " + answer,
                "jarvis-message"
            );


            if (
                typeof speak ===
                "function"
            ) {

                speak(answer);

            }


            return;
        }

    }


    /* ======================================
       NAME ABRUFEN
    ====================================== */

    if (
        lower.includes("wie heiße ich") ||
        lower.includes("was ist mein name") ||
        lower.includes("kennst du meinen namen")
    ) {

        let name = null;


        if (
            typeof getMemory ===
            "function"
        ) {

            name =
                getMemory("name");

        }


        let answer;


        if (name) {

            answer =
                "Du heißt " +
                name +
                ".";

        }

        else {

            answer =
                "Du hast mir deinen Namen noch nicht gesagt.";

        }


        addMessage(
            "JARVIS: " + answer,
            "jarvis-message"
        );


        if (
            typeof speak ===
            "function"
        ) {

            speak(answer);

        }


        return;
    }


    /* ======================================
       NAME VERGESSEN
    ====================================== */

    if (
        lower.includes("vergiss meinen namen")
    ) {

        if (
            typeof deleteMemory ===
            "function"
        ) {

            deleteMemory("name");

        }


        const answer =
            "Verstanden. Ich habe deinen Namen vergessen.";


        addMessage(
            "JARVIS: " + answer,
            "jarvis-message"
        );


        if (
            typeof speak ===
            "function"
        ) {

            speak(answer);

        }


        return;
    }


    /* ======================================
       BEGRÜSSUNG
    ====================================== */

    if (
        lower === "hallo" ||
        lower === "hi" ||
        lower === "hey"
    ) {

        let name = null;


        if (
            typeof getMemory ===
            "function"
        ) {

            name =
                getMemory("name");

        }


        let answer;


        if (name) {

            answer =
                "Hallo " +
                name +
                ".";

        }

        else {

            answer =
                "Hallo. Ich bin JARVIS.";

        }


        addMessage(
            "JARVIS: " + answer,
            "jarvis-message"
        );


        if (
            typeof speak ===
            "function"
        ) {

            speak(answer);

        }


        return;
    }


    /* ======================================
       WER BIST DU
    ====================================== */

    if (
        lower.includes("wer bist du") ||
        lower.includes("wie heißt du")
    ) {

        const answer =
            "Ich bin JARVIS, dein persönlicher Assistent.";


        addMessage(
            "JARVIS: " + answer,
            "jarvis-message"
        );


        if (
            typeof speak ===
            "function"
        ) {

            speak(answer);

        }


        return;
    }


    /* ======================================
       UHRZEIT
    ====================================== */

    if (
        lower.includes("wie spät") ||
        lower.includes("wie viel uhr") ||
        lower.includes("uhrzeit")
    ) {

        const now =
            new Date();


        const answer =
            "Es ist " +
            String(
                now.getHours()
            ).padStart(2, "0") +
            " Uhr " +
            String(
                now.getMinutes()
            ).padStart(2, "0") +
            ".";


        addMessage(
            "JARVIS: " + answer,
            "jarvis-message"
        );


        if (
            typeof speak ===
            "function"
        ) {

            speak(answer);

        }


        return;
    }


    /* ======================================
       DANKE
    ====================================== */

    if (
        lower.includes("danke")
    ) {

        const answer =
            "Gerne.";


        addMessage(
            "JARVIS: " + answer,
            "jarvis-message"
        );


        if (
            typeof speak ===
            "function"
        ) {

            speak(answer);

        }


        return;
    }


    /* ======================================
       STANDARD
    ====================================== */

    const answer =
        "Diese Funktion muss ich noch lernen.";


    addMessage(
        "JARVIS: " + answer,
        "jarvis-message"
    );


    if (
        typeof speak ===
        "function"
    ) {

        speak(answer);

    }

}


/* ==========================================
   SENDEN BUTTON
========================================== */

document
    .getElementById("sendButton")
    .addEventListener(
        "click",
        function() {

            sendText();

        }
    );


/* ==========================================
   ENTER
========================================== */

document
    .getElementById("userInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                event.preventDefault();

                sendText();

            }

        }
    );


/* ==========================================
   STIMME
========================================== */

document
    .getElementById("voiceButton")
    .addEventListener(
        "click",
        function() {

            if (
                typeof speak ===
                "function"
            ) {

                speak(
                    "Hallo. Ich bin JARVIS."
                );

            }

        }
    );


/* ==========================================
   MIKROFON
========================================== */

document
    .getElementById("micButton")
    .addEventListener(
        "click",
        function() {

            if (
                typeof startJarvis ===
                "function"
            ) {

                startJarvis();

            }

        }
    );


console.log(
    "JARVIS IST BEREIT."
);

</script>

</body>

</html>
