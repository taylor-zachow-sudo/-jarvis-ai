```html
<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>JARVIS AI</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    background: #050b14;

    font-family: Arial, sans-serif;

    color: #00d9ff;

    height: 100vh;

    overflow: hidden;

    display: flex;

    flex-direction: column;

    align-items: center;
}


/* JARVIS */

.circle {

    width: 200px;
    height: 200px;

    border-radius: 50%;

    border: 4px solid #00d9ff;

    box-shadow:
        0 0 20px #00d9ff,
        0 0 50px #00d9ff;

    animation: pulse 2s infinite;

    display: flex;

    justify-content: center;

    align-items: center;

    font-size: 30px;

    font-weight: bold;

    margin-top: 30px;
}


@keyframes pulse {

    0% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.07);
    }

    100% {
        transform: scale(1);
    }
}


/* STATUS */

#status {

    margin-top: 15px;

    font-size: 18px;
}


/* CHAT */

#chat {

    width: 90%;

    max-width: 600px;

    height: 45vh;

    overflow-y: auto;

    margin-top: 15px;

    padding: 10px;

    border: 1px solid #00d9ff;

    border-radius: 15px;

    background: #06121f;
}


.message {

    padding: 10px;

    margin: 7px 0;

    border-radius: 10px;

    word-wrap: break-word;
}


.user-message {

    background: #10283a;

    color: white;

    text-align: right;
}


.jarvis-message {

    background: #071a25;

    color: #00d9ff;

    text-align: left;
}


/* EINGABE */

.input-area {

    position: fixed;

    bottom: 80px;

    left: 50%;

    transform: translateX(-50%);

    width: 90%;

    max-width: 600px;

    display: flex;

    gap: 8px;
}


#userInput {

    flex: 1;

    padding: 14px;

    border-radius: 25px;

    border: 2px solid #00d9ff;

    background: #08121e;

    color: white;

    font-size: 17px;

    outline: none;
}


#sendButton {

    width: 55px;

    height: 55px;

    border-radius: 50%;

    border: none;

    background: #00d9ff;

    color: #050b14;

    font-size: 25px;

    cursor: pointer;
}


#sendButton:active {

    transform: scale(0.9);
}


/* BUTTONS */

.control-buttons {

    position: fixed;

    bottom: 15px;

    display: flex;

    gap: 10px;
}


.control-button {

    padding: 12px 20px;

    border: none;

    border-radius: 30px;

    background: #00d9ff;

    color: #050b14;

    font-size: 15px;

    cursor: pointer;
}

</style>

</head>


<body>


<div class="circle">
JARVIS
</div>


<div id="status">
SYSTEM ONLINE
</div>


<div id="chat">
</div>


<div class="input-area">

    <input
        id="userInput"
        type="text"
        placeholder="Nachricht an JARVIS..."
        autocomplete="off"
    >

    <button
        id="sendButton"
        type="button"
    >
        ➤
    </button>

</div>


<div class="control-buttons">

    <button
        id="voiceButton"
        class="control-button"
        type="button"
    >
        🔊 Stimme testen
    </button>

    <button
        id="micButton"
        class="control-button"
        type="button"
    >
        🎤 Aktivieren
    </button>

</div>


<!-- ==========================================
     DEINE DATEIEN
========================================== -->

<script src="memory.js?v=10"></script>

<script src="weather.js?v=10"></script>

<script src="reminders.js?v=10"></script>

<script src="script.js?v=10"></script>

<script src="chat.js?v=10"></script>


<!-- ==========================================
     SICHERER SENDEN-BUTTON
========================================== -->

<script>

console.log("JARVIS INDEX STARTET");


function sendText() {

    console.log("SENDTEXT FUNKTION STARTET");


    const input =
        document.getElementById("userInput");


    const chat =
        document.getElementById("chat");


    if (!input || !chat) {

        alert(
            "JARVIS: Eingabefeld oder Chat fehlt."
        );

        return;
    }


    const text =
        input.value.trim();


    if (!text) {

        return;
    }


    // Deine Nachricht

    const userMessage =
        document.createElement("div");


    userMessage.className =
        "message user-message";


    userMessage.textContent =
        "Du: " + text;


    chat.appendChild(
        userMessage
    );


    // Eingabe löschen

    input.value = "";


    // Einfache Antworten

    let answer =
        "Diese Funktion muss ich noch lernen.";


    const lower =
        text.toLowerCase();


    if (
        lower === "hallo" ||
        lower === "hi" ||
        lower === "hey"
    ) {

        answer =
            "Hallo. Ich bin JARVIS.";

    }


    else if (
        lower.includes("mein name ist ")
    ) {

        const name =
            text
            .substring(
                lower.indexOf("mein name ist ") + 14
            )
            .trim();


        if (
            typeof saveMemory ===
            "function"
        ) {

            saveMemory(
                "name",
                name
            );

        }


        answer =
            "Verstanden. Ich werde mir deinen Namen merken.";

    }


    else if (
        lower.includes("wie heiße ich")
    ) {

        let name = null;


        if (
            typeof getMemory ===
            "function"
        ) {

            name =
                getMemory("name");

        }


        if (name) {

            answer =
                "Du heißt " +
                name +
                ".";

        }

        else {

            answer =
                "Du hast mir deinen Namen noch nicht gesagt.";

        }

    }


    else if (
        lower.includes("wer bist du") ||
        lower.includes("wie heißt du")
    ) {

        answer =
            "Ich bin JARVIS, dein persönlicher Assistent.";

    }


    else if (
        lower.includes("danke")
    ) {

        answer =
            "Gerne.";

    }


    // JARVIS Nachricht

    const jarvisMessage =
        document.createElement("div");


    jarvisMessage.className =
        "message jarvis-message";


    jarvisMessage.textContent =
        "JARVIS: " + answer;


    chat.appendChild(
        jarvisMessage
    );


    chat.scrollTop =
        chat.scrollHeight;


    // Stimme

    if (
        typeof speak ===
        "function"
    ) {

        speak(answer);

    }


    console.log(
        "JARVIS Antwort:",
        answer
    );

}


/* ==========================================
   BUTTON
========================================== */

document
    .getElementById("sendButton")
    .addEventListener(
        "click",
        function() {

            sendText();

        }
    );


/* ==========================================
   ENTER
========================================== */

document
    .getElementById("userInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                event.preventDefault();

                sendText();

            }

        }
    );


/* ==========================================
   STIMME
========================================== */

document
    .getElementById("voiceButton")
    .addEventListener(
        "click",
        function() {

            if (
                typeof speak ===
                "function"
            ) {

                speak(
                    "Hallo. Ich bin JARVIS."
                );

            }

        }
    );


/* ==========================================
   MIKROFON
========================================== */

document
    .getElementById("micButton")
    .addEventListener(
        "click",
        function() {

            if (
                typeof startJarvis ===
                "function"
            ) {

                startJarvis();

            }

        }
    );


console.log(
    "JARVIS IST BEREIT"
);

</script>

</body>

</html>
