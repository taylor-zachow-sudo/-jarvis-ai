<!DOCTYPE html>
<html lang="de">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JARVIS AI</title>

<style>

/* =====================================================
   GRUNDLAYOUT
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
    color: #00d9ff;
}

body {
    position: relative;
}


/* =====================================================
   HINTERGRUND
===================================================== */

.background {
    position: fixed;
    inset: 0;

    background:
        radial-gradient(
            circle at center,
            rgba(0, 70, 110, 0.35) 0%,
            rgba(0, 20, 40, 0.18) 30%,
            #000 70%
        );

    overflow: hidden;
}


/* horizontale HUD-Linien */

.background::before {
    content: "";

    position: absolute;
    inset: 0;

    background:
        repeating-linear-gradient(
            0deg,
            transparent 0px,
            transparent 4px,
            rgba(0, 190, 255, 0.035) 5px
        );
}


/* =====================================================
   HAUPTBEREICH
===================================================== */

.jarvis-screen {
    position: relative;

    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;

    align-items: center;
}


/* =====================================================
   TITEL
===================================================== */

.top-title {
    position: absolute;

    top: 18px;

    font-size: 13px;

    letter-spacing: 7px;

    color: #5be8ff;

    opacity: 0.9;

    text-shadow:
        0 0 8px #00d9ff,
        0 0 20px #00d9ff;
}


/* =====================================================
   JARVIS HUD
===================================================== */

.hud {

    position: absolute;

    top: 50%;

    left: 50%;

    width: 390px;
    height: 390px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    display: flex;

    align-items: center;
    justify-content: center;
}


/* äußerer Kreis */

.hud::before {

    content: "";

    position: absolute;

    width: 100%;
    height: 100%;

    border-radius: 50%;

    border:
        2px solid
        rgba(0, 210, 255, 0.65);

    box-shadow:
        0 0 15px rgba(0, 210, 255, 0.5),
        inset 0 0 30px rgba(0, 150, 255, 0.15);
}


/* zweiter Kreis */

.hud::after {

    content: "";

    position: absolute;

    width: 78%;
    height: 78%;

    border-radius: 50%;

    border:
        1px solid
        rgba(0, 190, 255, 0.4);

    box-shadow:
        0 0 15px rgba(0, 190, 255, 0.25);
}


/* =====================================================
   ROTIERENDE RINGE
===================================================== */

.ring {

    position: absolute;

    border-radius: 50%;

    border: 2px solid transparent;

    border-top-color: #00d9ff;

    border-right-color: rgba(0, 217, 255, 0.3);

    animation: rotate 5s linear infinite;
}


.ring.one {

    width: 100%;
    height: 100%;

    animation-duration: 8s;
}


.ring.two {

    width: 88%;
    height: 88%;

    border-top-color: transparent;

    border-bottom-color: #00d9ff;

    animation-duration: 6s;

    animation-direction: reverse;
}


.ring.three {

    width: 68%;
    height: 68%;

    border-left-color: #00d9ff;

    border-top-color: transparent;

    animation-duration: 4s;
}


@keyframes rotate {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }

}


/* =====================================================
   JARVIS ZENTRUM
===================================================== */

.core {

    position: relative;

    z-index: 5;

    width: 145px;
    height: 145px;

    border-radius: 50%;

    display: flex;

    justify-content: center;
    align-items: center;

    background:
        radial-gradient(
            circle,
            rgba(0, 190, 255, 0.18),
            rgba(0, 30, 50, 0.5) 65%,
            transparent
        );

    border:
        2px solid
        rgba(0, 217, 255, 0.65);

    box-shadow:
        0 0 15px #00d9ff,
        0 0 45px rgba(0, 217, 255, 0.5),
        inset 0 0 35px rgba(0, 217, 255, 0.3);

    animation:
        corePulse 2.5s ease-in-out infinite;
}


@keyframes corePulse {

    0%,
    100% {
        transform: scale(1);
        box-shadow:
            0 0 15px #00d9ff,
            0 0 35px rgba(0,217,255,.35),
            inset 0 0 30px rgba(0,217,255,.2);
    }

    50% {
        transform: scale(1.06);
        box-shadow:
            0 0 25px #00d9ff,
            0 0 70px rgba(0,217,255,.7),
            inset 0 0 45px rgba(0,217,255,.4);
    }
}


.core-text {

    font-size: 19px;

    letter-spacing: 8px;

    margin-left: 8px;

    font-weight: bold;

    color: #76edff;

    text-shadow:
        0 0 8px #00d9ff,
        0 0 18px #00d9ff;
}


/* =====================================================
   STATUS
===================================================== */

#status {

    position: absolute;

    top: calc(50% + 210px);

    font-size: 12px;

    letter-spacing: 4px;

    color: #00d9ff;

    text-shadow:
        0 0 8px #00d9ff;

    text-align: center;
}


/* =====================================================
   LINKES HUD PANEL
===================================================== */

.system-panel {

    position: absolute;

    left: 22px;

    top: 50%;

    transform:
        translateY(-50%);

    display: flex;

    flex-direction: column;

    gap: 12px;
}


.panel {

    width: 120px;

    height: 47px;

    padding: 6px 10px;

    border-left: 3px solid #00d9ff;

    border-top: 1px solid rgba(0,217,255,.35);

    border-bottom: 1px solid rgba(0,217,255,.2);

    background:
        rgba(0, 30, 45, 0.35);

    color: #51dfff;

    font-size: 9px;

    letter-spacing: 2px;

    text-shadow:
        0 0 6px #00d9ff;
}


.panel span {

    display: block;

    margin-top: 4px;

    font-size: 14px;

    letter-spacing: 2px;

    color: #00d9ff;
}


/* =====================================================
   UNTERE SPRACHANIMATION
===================================================== */

.voice-area {

    position: absolute;

    bottom: 105px;

    left: 50%;

    transform:
        translateX(-50%);

    width: 260px;

    height: 55px;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 4px;
}


.bar {

    width: 3px;

    height: 15px;

    background: #00d9ff;

    box-shadow:
        0 0 8px #00d9ff;

    animation:
        voice 1s ease-in-out infinite;
}


.bar:nth-child(2) {
    animation-delay: .1s;
}

.bar:nth-child(3) {
    animation-delay: .2s;
}

.bar:nth-child(4) {
    animation-delay: .3s;
}

.bar:nth-child(5) {
    animation-delay: .4s;
}

.bar:nth-child(6) {
    animation-delay: .2s;
}

.bar:nth-child(7) {
    animation-delay: .1s;
}

.bar:nth-child(8) {
    animation-delay: .3s;
}

.bar:nth-child(9) {
    animation-delay: .15s;
}

.bar:nth-child(10) {
    animation-delay: .25s;
}


@keyframes voice {

    0%,
    100% {
        height: 10px;
    }

    50% {
        height: 42px;
    }
}


/* =====================================================
   CHAT
===================================================== */

#chat {

    position: absolute;

    top: 20px;

    left: 50%;

    transform:
        translateX(-50%);

    width: 90%;

    max-width: 500px;

    max-height: 130px;

    overflow-y: auto;

    padding: 5px;

    z-index: 20;
}


.message {

    padding: 7px 10px;

    margin: 5px 0;

    border-radius: 7px;

    font-size: 13px;

    background:
        rgba(0, 25, 40, 0.65);

    border:
        1px solid
        rgba(0,217,255,.2);
}


.user-message {

    color: white;

    text-align: right;
}


.jarvis-message {

    color: #00d9ff;

    text-align: left;
}


/* =====================================================
   EINGABEFELD
===================================================== */

.input-area {

    position: fixed;

    bottom: 22px;

    left: 50%;

    transform:
        translateX(-50%);

    width: 92%;

    max-width: 520px;

    display: flex;

    gap: 8px;

    z-index: 50;
}


#userInput {

    flex: 1;

    height: 48px;

    padding:
        0 18px;

    border:
        1px solid
        #00d9ff;

    border-radius: 25px;

    outline: none;

    background:
        rgba(0, 15, 25, 0.9);

    color: white;

    font-size: 15px;

    box-shadow:
        0 0 12px
        rgba(0,217,255,.2);
}


#userInput::placeholder {

    color:
        rgba(0,217,255,.55);
}


#sendButton {

    width: 48px;

    height: 48px;

    border-radius: 50%;

    border:
        1px solid #00d9ff;

    background:
        rgba(0, 30, 45, 0.9);

    color: #00d9ff;

    font-size: 20px;

    cursor: pointer;

    box-shadow:
        0 0 12px
        rgba(0,217,255,.35);
}


/* =====================================================
   BUTTONS
===================================================== */

.control-buttons {

    position: fixed;

    bottom: 82px;

    left: 50%;

    transform:
        translateX(-50%);

    display: flex;

    gap: 8px;

    z-index: 50;
}


.control-button {

    padding:
        9px 15px;

    border:
        1px solid
        #00d9ff;

    border-radius: 20px;

    background:
        rgba(0, 20, 30, 0.8);

    color: #00d9ff;

    font-size: 12px;

    cursor: pointer;

    box-shadow:
        0 0 10px
        rgba(0,217,255,.2);
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    .hud {

        width: 330px;
        height: 330px;
    }


    .core {

        width: 115px;
        height: 115px;
    }


    .core-text {

        font-size: 15px;

        letter-spacing: 6px;
    }


    .system-panel {

        left: 10px;

        gap: 7px;
    }


    .panel {

        width: 95px;

        height: 42px;

        font-size: 7px;
    }


    .panel span {

        font-size: 11px;
    }


    #status {

        top: calc(50% + 180px);

        font-size: 9px;

        letter-spacing: 3px;
    }


    .voice-area {

        bottom: 150px;

        width: 200px;
    }


    .control-buttons {

        bottom: 78px;
    }


    .control-button {

        padding:
            8px 10px;

        font-size: 10px;
    }

}

</style>

</head>


<body>


<div class="background"></div>


<div class="jarvis-screen">


    <!-- ==========================================
         TITEL
    =========================================== -->

    <div class="top-title">
        J A R V I S
    </div>


    <!-- ==========================================
         CHAT
    =========================================== -->

    <div id="chat"></div>


    <!-- ==========================================
         HUD
    =========================================== -->

    <div class="hud">

        <div class="ring one"></div>

        <div class="ring two"></div>

        <div class="ring three"></div>


        <div class="core">

            <div class="core-text">
                JARVIS
            </div>

        </div>

    </div>


    <!-- ==========================================
         STATUS
    =========================================== -->

    <div id="status">
        SYSTEM ONLINE
    </div>


    <!-- ==========================================
         SYSTEM PANEL
    =========================================== -->

    <div class="system-panel">

        <div class="panel">
            SYSTEM
            <span>ONLINE</span>
        </div>

        <div class="panel">
            MEMORY
            <span>ACTIVE</span>
        </div>

        <div class="panel">
            VOICE
            <span>READY</span>
        </div>

        <div class="panel">
            WEATHER
            <span>READY</span>
        </div>

        <div class="panel">
            APPS
            <span>READY</span>
        </div>

    </div>


    <!-- ==========================================
         SPRACHANIMATION
    =========================================== -->

    <div class="voice-area">

        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>

    </div>


    <!-- ==========================================
         EINGABE
    =========================================== -->

    <div class="input-area">

        <input
            id="userInput"
            type="text"
            placeholder="Frag JARVIS..."
            autocomplete="off"
        >

        <button
            id="sendButton"
            type="button"
        >
            ➤
        </button>

    </div>


    <!-- ==========================================
         STEUERUNG
    =========================================== -->

    <div class="control-buttons">

        <button
            id="voiceButton"
            class="control-button"
            type="button"
        >
            🔊 Stimme
        </button>

        <button
            id="micButton"
            class="control-button"
            type="button"
        >
            🎤 Sprechen
        </button>

    </div>

</div>


<!-- ==========================================
     DEINE FUNKTIONEN
========================================== -->

<script src="memory.js"></script>
<script src="weather.js"></script>
<script src="reminders.js"></script>
<script src="script.js"></script>
<script src="chat.js"></script>


<!-- ==========================================
     BUTTONEN
========================================== -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function() {

        const sendButton =
            document.getElementById("sendButton");

        const userInput =
            document.getElementById("userInput");

        const voiceButton =
            document.getElementById("voiceButton");

        const micButton =
            document.getElementById("micButton");


        /* SENDEN */

        if (sendButton) {

            sendButton.addEventListener(
                "click",
                function() {

                    if (
                        typeof sendText ===
                        "function"
                    ) {

                        sendText();

                    } else {

                        console.error(
                            "sendText() fehlt."
                        );

                    }

                }
            );

        }


        /* ENTER */

        if (userInput) {

            userInput.addEventListener(
                "keydown",
                function(event) {

                    if (
                        event.key === "Enter"
                    ) {

                        event.preventDefault();

                        if (
                            typeof sendText ===
                            "function"
                        ) {

                            sendText();

                        }

                    }

                }
            );

        }


        /* STIMME */

        if (voiceButton) {

            voiceButton.addEventListener(
                "click",
                function() {

                    if (
                        typeof speak ===
                        "function"
                    ) {

                        speak(
                            "Hallo. Ich bin JARVIS."
                        );

                    }

                }
            );

        }


        /* MIKROFON */

        if (micButton) {

            micButton.addEventListener(
                "click",
                function() {

                    if (
                        typeof startJarvis ===
                        "function"
                    ) {

                        startJarvis();

                    }

                }
            );

        }

    }
);

</script>


</body>

</html>
