<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>JARVIS AI</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
    color: #00d9ff;
}

body {
    position: relative;
}


/* ==========================================
   HINTERGRUND
========================================== */

.background {
    position: fixed;
    inset: 0;

    background:
        radial-gradient(
            circle at center,
            rgba(0, 80, 120, 0.35),
            rgba(0, 20, 40, 0.15) 35%,
            #000 75%
        );
}


/* ==========================================
   HAUPTBEREICH
========================================== */

.jarvis-screen {
    position: relative;

    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;
    align-items: center;
}


/* ==========================================
   TITEL
========================================== */

.top-title {

    position: absolute;

    top: 18px;

    font-size: 13px;

    letter-spacing: 7px;

    color: #5be8ff;

    text-shadow:
        0 0 8px #00d9ff,
        0 0 20px #00d9ff;
}


/* ==========================================
   HUD
========================================== */

.hud {

    position: absolute;

    top: 50%;
    left: 50%;

    width: 360px;
    height: 360px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    display: flex;

    align-items: center;
    justify-content: center;
}


/* äußerer Kreis */

.hud::before {

    content: "";

    position: absolute;

    width: 100%;
    height: 100%;

    border-radius: 50%;

    border:
        2px solid
        rgba(0, 210, 255, 0.65);

    box-shadow:
        0 0 20px rgba(0, 210, 255, 0.4);
}


/* innerer Kreis */

.hud::after {

    content: "";

    position: absolute;

    width: 76%;
    height: 76%;

    border-radius: 50%;

    border:
        1px solid
        rgba(0, 190, 255, 0.5);
}


/* ==========================================
   RINGE
========================================== */

.ring {

    position: absolute;

    border-radius: 50%;

    border: 2px solid transparent;

    animation:
        rotate 6s linear infinite;
}


.ring.one {

    width: 100%;
    height: 100%;

    border-top-color: #00d9ff;
}


.ring.two {

    width: 88%;
    height: 88%;

    border-bottom-color: #00d9ff;

    animation-direction: reverse;

    animation-duration: 5s;
}


.ring.three {

    width: 68%;
    height: 68%;

    border-left-color: #00d9ff;

    animation-duration: 4s;
}


@keyframes rotate {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }

}


/* ==========================================
   JARVIS KERN
========================================== */

.core {

    position: relative;

    z-index: 5;

    width: 140px;
    height: 140px;

    border-radius: 50%;

    display: flex;

    justify-content: center;
    align-items: center;

    background:
        radial-gradient(
            circle,
            rgba(0, 190, 255, 0.2),
            rgba(0, 30, 50, 0.5) 65%,
            transparent
        );

    border:
        2px solid
        rgba(0, 217, 255, 0.7);

    box-shadow:
        0 0 20px #00d9ff,
        0 0 50px rgba(0, 217, 255, 0.5);

    animation:
        pulse 2.5s infinite;
}


@keyframes pulse {

    0% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.06);
    }

    100% {
        transform: scale(1);
    }

}


.core-text {

    font-size: 18px;

    letter-spacing: 7px;

    margin-left: 7px;

    font-weight: bold;

    color: #76edff;

    text-shadow:
        0 0 8px #00d9ff,
        0 0 18px #00d9ff;
}


/* ==========================================
   STATUS
========================================== */

#status {

    position: absolute;

    top: calc(50% + 195px);

    font-size: 11px;

    letter-spacing: 4px;

    text-align: center;

    text-shadow:
        0 0 8px #00d9ff;
}


/* ==========================================
   LINKES SYSTEMPANEL
========================================== */

.system-panel {

    position: absolute;

    left: 15px;

    top: 50%;

    transform:
        translateY(-50%);

    display: flex;

    flex-direction: column;

    gap: 10px;
}


.panel {

    width: 105px;

    height: 43px;

    padding: 6px 8px;

    border-left:
        3px solid #00d9ff;

    border-top:
        1px solid rgba(0,217,255,.3);

    border-bottom:
        1px solid rgba(0,217,255,.2);

    background:
        rgba(0, 30, 45, .35);

    font-size: 8px;

    letter-spacing: 2px;
}


.panel span {

    display: block;

    margin-top: 3px;

    font-size: 12px;

    color: #00d9ff;
}


/* ==========================================
   CHAT
========================================== */

#chat {

    position: absolute;

    top: 55px;

    left: 50%;

    transform:
        translateX(-50%);

    width: 90%;

    max-width: 500px;

    max-height: 120px;

    overflow-y: auto;

    z-index: 10;
}


.message {

    padding: 7px 10px;

    margin: 5px 0;

    border-radius: 8px;

    font-size: 13px;

    background:
        rgba(0, 25, 40, .7);
}


.user-message {

    color: white;

    text-align: right;
}


.jarvis-message {

    color: #00d9ff;

    text-align: left;
}


/* ==========================================
   SPRACHANIMATION
========================================== */

.voice-area {

    position: absolute;

    bottom: 130px;

    left: 50%;

    transform:
        translateX(-50%);

    width: 230px;

    height: 45px;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 4px;
}


.bar {

    width: 3px;

    height: 12px;

    background: #00d9ff;

    box-shadow:
        0 0 7px #00d9ff;

    animation:
        voice 1s infinite;
}


.bar:nth-child(2) {
    animation-delay: .1s;
}

.bar:nth-child(3) {
    animation-delay: .2s;
}

.bar:nth-child(4) {
    animation-delay: .3s;
}

.bar:nth-child(5) {
    animation-delay: .4s;
}

.bar:nth-child(6) {
    animation-delay: .2s;
}

.bar:nth-child(7) {
    animation-delay: .1s;
}

.bar:nth-child(8) {
    animation-delay: .3s;
}


@keyframes voice {

    0%,
    100% {
        height: 10px;
    }

    50% {
        height: 38px;
    }

}


/* ==========================================
   EINGABE
========================================== */

.input-area {

    position: fixed;

    bottom: 20px;

    left: 50%;

    transform:
        translateX(-50%);

    width: 92%;

    max-width: 520px;

    display: flex;

    gap: 8px;

    z-index: 100;
}


#userInput {

    flex: 1;

    height: 48px;

    padding:
        0 18px;

    border:
        1px solid #00d9ff;

    border-radius: 25px;

    outline: none;

    background:
        rgba(0, 15, 25, .95);

    color: white;

    font-size: 15px;
}


#userInput::placeholder {

    color:
        rgba(0,217,255,.55);
}


#sendButton {

    width: 48px;

    height: 48px;

    border-radius: 50%;

    border:
        1px solid #00d9ff;

    background:
        rgba(0, 30, 45, .95);

    color: #00d9ff;

    font-size: 20px;

    cursor: pointer;
}


/* ==========================================
   BUTTONS
========================================== */

.control-buttons {

    position: fixed;

    bottom: 78px;

    left: 50%;

    transform:
        translateX(-50%);

    display: flex;

    gap: 8px;

    z-index: 100;
}


.control-button {

    padding:
        9px 15px;

    border:
        1px solid #00d9ff;

    border-radius: 20px;

    background:
        rgba(0, 20, 30, .9);

    color: #00d9ff;

    font-size: 12px;

    cursor: pointer;
}


/* ==========================================
   HANDY
========================================== */

@media (max-width: 600px) {

    .hud {

        width: 320px;
        height: 320px;
    }


    .core {

        width: 115px;
        height: 115px;
    }


    .core-text {

        font-size: 15px;

        letter-spacing: 5px;
    }


    .system-panel {

        left: 5px;

        gap: 6px;
    }


    .panel {

        width: 88px;

        height: 39px;

        font-size: 7px;
    }


    .panel span {

        font-size: 10px;
    }


    #status {

        top: calc(50% + 175px);

        font-size: 9px;
    }


    .voice-area {

        bottom: 135px;
    }


    .control-buttons {

        bottom: 75px;
    }

}

</style>

</head>


<body>


<div class="background"></div>


<div class="jarvis-screen">


    <div class="top-title">
        J A R V I S
    </div>


    <!-- CHAT -->

    <div id="chat"></div>


    <!-- HUD -->

    <div class="hud">

        <div class="ring one"></div>

        <div class="ring two"></div>

        <div class="ring three"></div>


        <div class="core">

            <div class="core-text">
                JARVIS
            </div>

        </div>

    </div>


    <!-- STATUS -->

    <div id="status">
        SYSTEM ONLINE
    </div>


    <!-- SYSTEM -->

    <div class="system-panel">

        <div class="panel">
            SYSTEM
            <span>ONLINE</span>
        </div>

        <div class="panel">
            MEMORY
            <span>ACTIVE</span>
        </div>

        <div class="panel">
            VOICE
            <span>READY</span>
        </div>

        <div class="panel">
            WEATHER
            <span>READY</span>
        </div>

        <div class="panel">
            APPS
            <span>READY</span>
        </div>

    </div>


    <!-- SPRACHANIMATION -->

    <div class="voice-area">

        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>

    </div>


    <!-- EINGABE -->

    <div class="input-area">

        <input
            id="userInput"
            type="text"
            placeholder="Frag JARVIS..."
            autocomplete="off"
        >

        <button
            id="sendButton"
            type="button"
        >
            ➤
        </button>

    </div>


    <!-- BUTTONS -->

    <div class="control-buttons">

        <button
            id="voiceButton"
            class="control-button"
            type="button"
        >
            🔊 Stimme
        </button>


        <button
            id="micButton"
            class="control-button"
            type="button"
        >
            🎤 Sprechen
        </button>

    </div>

</div>


<!-- ==========================================
     DATEIEN
========================================== -->

<script src="memory.js"></script>

<script src="weather.js"></script>

<script src="reminders.js"></script>

<script src="script.js"></script>

<script src="chat.js"></script>


<!-- ==========================================
     NUR BUTTONEN VERBINDEN
========================================== -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function() {

        const sendButton =
            document.getElementById("sendButton");

        const userInput =
            document.getElementById("userInput");

        const voiceButton =
            document.getElementById("voiceButton");

        const micButton =
            document.getElementById("micButton");


        /* SENDEN */

        if (sendButton) {

            sendButton.addEventListener(
                "click",
                function() {

                    if (
                        typeof sendText ===
                        "function"
                    ) {

                        sendText();

                    } else {

                        console.error(
                            "FEHLER: chat.js / sendText fehlt!"
                        );

                    }

                }
            );

        }


        /* ENTER */

        if (userInput) {

            userInput.addEventListener(
                "keydown",
                function(event) {

                    if (
                        event.key === "Enter"
                    ) {

                        event.preventDefault();

                        if (
                            typeof sendText ===
                            "function"
                        ) {

                            sendText();

                        }

                    }

                }
            );

        }


        /* STIMME */

        if (voiceButton) {

            voiceButton.addEventListener(
                "click",
                function() {

                    if (
                        typeof speak ===
                        "function"
                    ) {

                        speak(
                            "Hallo. Ich bin JARVIS."
                        );

                    }

                }
            );

        }


        /* MIKROFON */

        if (micButton) {

            micButton.addEventListener(
                "click",
                function() {

                    if (
                        typeof startJarvis ===
                        "function"
                    ) {

                        startJarvis();

                    }

                }
            );

        }

    }
);

</script>


</body>

</html>
