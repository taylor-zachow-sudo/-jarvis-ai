<!DOCTYPE html>
<html lang="de">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JARVIS AI</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #050b14;
    font-family: Arial, sans-serif;
    color: #00d9ff;
    height: 100vh;
    overflow: hidden;

    display: flex;
    flex-direction: column;
    align-items: center;
}


/* JARVIS */

.circle {
    width: 200px;
    height: 200px;

    border-radius: 50%;

    border: 4px solid #00d9ff;

    box-shadow:
        0 0 20px #00d9ff,
        0 0 50px #00d9ff;

    animation: pulse 2s infinite;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 30px;
    font-weight: bold;

    margin-top: 30px;
}

@keyframes pulse {

    0% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.07);
    }

    100% {
        transform: scale(1);
    }
}


/* STATUS */

#status {
    margin-top: 15px;
    font-size: 18px;
}


/* CHAT */

#chat {

    width: 90%;
    max-width: 600px;

    height: 45vh;

    overflow-y: auto;

    margin-top: 15px;

    padding: 10px;

    border: 1px solid #00d9ff;

    border-radius: 15px;

    background: #06121f;
}


/* NACHRICHTEN */

.message {

    padding: 10px;

    margin: 7px 0;

    border-radius: 10px;

    word-wrap: break-word;
}


.user-message {

    background: #10283a;

    color: white;

    text-align: right;
}


.jarvis-message {

    background: #071a25;

    color: #00d9ff;

    text-align: left;
}


/* EINGABE */

.input-area {

    position: fixed;

    bottom: 80px;

    left: 50%;

    transform: translateX(-50%);

    width: 90%;

    max-width: 600px;

    display: flex;

    gap: 8px;
}


#userInput {

    flex: 1;

    padding: 14px;

    border-radius: 25px;

    border: 2px solid #00d9ff;

    background: #08121e;

    color: white;

    font-size: 17px;

    outline: none;
}


#sendButton {

    width: 55px;

    height: 55px;

    border-radius: 50%;

    border: none;

    background: #00d9ff;

    color: #050b14;

    font-size: 25px;

    cursor: pointer;
}


#sendButton:active {

    transform: scale(0.9);

}


/* BUTTONS */

.control-buttons {

    position: fixed;

    bottom: 15px;

    display: flex;

    gap: 10px;
}


.control-button {

    padding: 12px 20px;

    border: none;

    border-radius: 30px;

    background: #00d9ff;

    color: #050b14;

    font-size: 15px;

    cursor: pointer;
}


@media (max-width: 600px) {

    .circle {

        width: 160px;
        height: 160px;

        font-size: 24px;

    }

    #chat {

        width: 95%;

        height: 43vh;

    }

}

</style>

</head>


<body>


<div class="circle">
JARVIS
</div>


<div id="status">
SYSTEM ONLINE
</div>


<div id="chat"></div>


<div class="input-area">

    <input
        id="userInput"
        type="text"
        placeholder="Nachricht an JARVIS..."
        autocomplete="off"
    >

    <button
        id="sendButton"
        type="button"
    >
        ➤
    </button>

</div>


<div class="control-buttons">

</div>

</html>
